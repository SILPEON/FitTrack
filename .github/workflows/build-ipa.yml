name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for iPhone (no code signing)
        shell: bash
        run: |
          set -o pipefail
          if ! xcodebuild build \
            -project FitTrack.xcodeproj \
            -target FitTrack \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > build.log 2>&1; then
            echo "===== BUILD FAILED, errors: ====="
            grep -E "error:" build.log | sort -u
            tail -40 build.log
            exit 1
          fi
          test -d build/Release-iphoneos/FitTrack.app

      - name: Verify build
        shell: bash
        run: |
          grep -q "BUILD SUCCEEDED" build.log && echo "BUILD SUCCEEDED"
          echo "Warnings: $(grep -E 'warning:' build.log | grep -v 'ld: warning' | sort -u | wc -l)"
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" build.log | sed 's|.*/FitTrack/FitTrack/||' | sort -u | head -60
          APP=build/Release-iphoneos/FitTrack.app
          ls -la "$APP"
          file "$APP/FitTrack"
          plutil -p "$APP/Info.plist" | grep -E -A2 "UIBackgroundModes|NSLocation|CFBundleIdentifier|MinimumOSVersion|CFBundleIcon"

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/FitTrack.app Payload/
          zip -qry FitTrack.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FitTrack-ipa
          path: FitTrack.ipa
