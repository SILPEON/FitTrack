name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for iPhone (no code signing)
        shell: bash
        run: |
          set -o pipefail
          if ! xcodebuild build \
            -project FitTrack.xcodeproj \
            -target FitTrack \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > build.log 2>&1; then
            echo "===== BUILD FAILED, errors: ====="
            grep -E "error:" build.log | sort -u
            tail -40 build.log
            exit 1
          fi
          test -d build/Release-iphoneos/FitTrack.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/FitTrack.app Payload/
          zip -qry FitTrack.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FitTrack-ipa
          path: FitTrack.ipa
